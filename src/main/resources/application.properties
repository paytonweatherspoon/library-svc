# Application Configuration
spring.application.name=library-svc

# ============================================
# H2 IN-MEMORY DATABASE CONFIGURATION
# ============================================
# In-memory only; data does not persist across restarts. DB_CLOSE_DELAY=-1 keeps
# the database alive for the app's lifetime instead of closing when a connection pool
# cycles its last connection.
spring.datasource.url=jdbc:h2:mem:;DB_CLOSE_ON_EXIT=FALSE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=pw
spring.datasource.password=password

# H2 Console configuration - explicitly enabled at root path
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
seed.data=true

# ============================================
# SpringDoc Swagger UI Configuration  
# ============================================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# JPA Configuration for auto DDL creation
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
logging.level.org.hibernate.SQL=debug